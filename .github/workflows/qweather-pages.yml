name: Refresh QWeather data and publish Pages
on:
  schedule:
    - cron: "30 0 * * *" # 08:30 Asia/Shanghai
    - cron: "45 0 * * *" # 08:45 Asia/Shanghai fallback
    - cron: "15 1 * * *" # 09:15 Asia/Shanghai fallback
    - cron: "10 9 * * *" # 17:10 Asia/Shanghai
    - cron: "25 9 * * *" # 17:25 Asia/Shanghai fallback
    - cron: "45 9 * * *" # 17:45 Asia/Shanghai fallback
  workflow_dispatch:
    inputs:
      publish_only:
        description: "仅发布页面，不请求天气数据"
        required: false
        default: false
        type: boolean
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: qweather-pages
  cancel-in-progress: false
jobs:
  refresh-and-publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out site
        uses: actions/checkout@v4
      - name: Set up Python
        if: ${{ !inputs.publish_only }}
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Skip a scheduled fallback if this slot already refreshed
        id: retry_guard
        if: ${{ github.event_name == 'schedule' }}
        run: |
          python - <<'PY'
          import json
          import os
          from datetime import datetime, time
          from pathlib import Path
          from zoneinfo import ZoneInfo

          morning_schedules = {"30 0 * * *", "45 0 * * *", "15 1 * * *"}
          schedule = os.environ["SCHEDULE"]
          slot = "morning" if schedule in morning_schedules else "evening"
          data = json.loads(Path("weather-data.json").read_text(encoding="utf-8"))
          now = datetime.now(ZoneInfo("Asia/Shanghai"))
          slot_start = datetime.combine(
              now.date(), time(8, 30) if slot == "morning" else time(17, 10),
              tzinfo=ZoneInfo("Asia/Shanghai"),
          )
          try:
              updated_at = datetime.fromisoformat(data.get("updatedAt", ""))
          except (TypeError, ValueError):
              updated_at = None
          already_refreshed = (
              data.get("mode") == slot
              and updated_at is not None
              and updated_at >= slot_start
          )
          print(f"Scheduled slot: {slot}; snapshot updated at: {updated_at}; already refreshed: {already_refreshed}")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"skip={'true' if already_refreshed else 'false'}\n")
          PY
        env:
          SCHEDULE: ${{ github.event.schedule }}
      - name: Verify QWeather credentials before batch requests
        if: ${{ !inputs.publish_only && (github.event_name != 'schedule' || steps.retry_guard.outputs.skip != 'true') }}
        env:
          QWEATHER_API_HOST: ${{ vars.QWEATHER_API_HOST }}
          QWEATHER_API_KEY: ${{ secrets.QWEATHER_API_KEY }}
        run: |
          python - <<'PY'
          import qweather_refresh as q
          api = q.QWeather(q.required("QWEATHER_API_HOST"), q.required("QWEATHER_API_KEY"), 1)
          api.get("/weather/v1/current/39.92/116.41", {"lang": "zh"})
          print("QWeather authentication succeeded")
          PY
      - name: Fetch QWeather snapshot
        if: ${{ !inputs.publish_only && (github.event_name != 'schedule' || steps.retry_guard.outputs.skip != 'true') }}
        env:
          QWEATHER_API_HOST: ${{ vars.QWEATHER_API_HOST }}
          QWEATHER_API_KEY: ${{ secrets.QWEATHER_API_KEY }}
          QWEATHER_RUN_MODE: ${{ github.event_name == 'schedule' && (github.event.schedule == '30 0 * * *' || github.event.schedule == '45 0 * * *' || github.event.schedule == '15 1 * * *') && 'morning' || github.event_name == 'schedule' && 'evening' || '' }}
        run: python qweather_refresh.py
      - name: Persist latest snapshot for the next scheduled run
        if: ${{ !inputs.publish_only && (github.event_name != 'schedule' || steps.retry_guard.outputs.skip != 'true') }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add weather-data.json
          if ! git diff --cached --quiet; then
            git commit -m "Refresh QWeather snapshot"
            git push
          fi
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
