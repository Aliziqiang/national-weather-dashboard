name: Refresh QWeather data and publish Pages
on:
  schedule:
    - cron: "30 0 * * *" # 08:30 Asia/Shanghai
    - cron: "10 9 * * *" # 17:10 Asia/Shanghai
  workflow_dispatch:
    inputs:
      publish_only:
        description: "仅发布页面，不请求天气数据"
        required: false
        default: false
        type: boolean
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: qweather-pages
  cancel-in-progress: false
jobs:
  refresh-and-publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out site
        uses: actions/checkout@v4
      - name: Set up Python
        if: ${{ !inputs.publish_only }}
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify QWeather credentials before batch requests
        if: ${{ !inputs.publish_only }}
        env:
          QWEATHER_API_HOST: ${{ vars.QWEATHER_API_HOST }}
          QWEATHER_API_KEY: ${{ secrets.QWEATHER_API_KEY }}
        run: |
          python - <<'PY'
          import qweather_refresh as q
          api = q.QWeather(q.required("QWEATHER_API_HOST"), q.required("QWEATHER_API_KEY"), 1)
          api.get("/weather/v1/current/39.92/116.41", {"lang": "zh"})
          print("QWeather authentication succeeded")
          PY
      - name: Fetch QWeather snapshot
        if: ${{ !inputs.publish_only }}
        env:
          QWEATHER_API_HOST: ${{ vars.QWEATHER_API_HOST }}
          QWEATHER_API_KEY: ${{ secrets.QWEATHER_API_KEY }}
        run: python qweather_refresh.py
      - name: Persist latest snapshot for the next scheduled run
        if: ${{ !inputs.publish_only }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add weather-data.json
          if ! git diff --cached --quiet; then
            git commit -m "Refresh QWeather snapshot"
            git push
          fi
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
