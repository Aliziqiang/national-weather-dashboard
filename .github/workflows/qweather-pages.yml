name: Refresh QWeather data and publish Pages
on:
  schedule:
    # Primary refresh and retries. All times are Asia/Shanghai (UTC+8).
    # Later jobs only make weather requests if an earlier attempt did not refresh this slot.
    - cron: "30,45 0 * * *" # 08:30, 08:45
    - cron: "15,30,45 1 * * *" # 09:15, 09:30, 09:45
    - cron: "15,30,45 2 * * *" # 10:15, 10:30, 10:45
    - cron: "10,25,40,55 9 * * *" # 17:10, 17:25, 17:40, 17:55
    - cron: "10,25,40 10 * * *" # 18:10, 18:25, 18:40
  workflow_dispatch:
    inputs:
      publish_only:
        description: "仅发布页面，不请求天气数据"
        required: false
        default: false
        type: boolean

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: qweather-pages
  cancel-in-progress: false

jobs:
  refresh-and-publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out site
        uses: actions/checkout@v4

      - name: Skip a scheduled retry if this slot already refreshed
        id: retry_guard
        if: ${{ github.event_name == 'schedule' }}
        run: |
          python - <<'PY'
          import json
          import os
          from datetime import datetime, time
          from pathlib import Path
          from zoneinfo import ZoneInfo

          morning_schedules = {
              "30,45 0 * * *",
              "15,30,45 1 * * *",
              "15,30,45 2 * * *",
          }
          schedule = os.environ["SCHEDULE"]
          slot = "morning" if schedule in morning_schedules else "evening"
          data = json.loads(Path("weather-data.json").read_text(encoding="utf-8"))
          tz = ZoneInfo("Asia/Shanghai")
          now = datetime.now(tz)
          slot_start = datetime.combine(
              now.date(),
              time(8, 30) if slot == "morning" else time(17, 10),
              tzinfo=tz,
          )
          try:
              updated_at = datetime.fromisoformat(data.get("updatedAt", ""))
              if updated_at.tzinfo is None:
                  updated_at = updated_at.replace(tzinfo=tz)
          except (TypeError, ValueError):
              updated_at = None
          already_refreshed = (
              data.get("mode") == slot
              and updated_at is not None
              and updated_at.astimezone(tz) >= slot_start
          )
          print(
              f"Scheduled slot: {slot}; snapshot updated at: {updated_at}; "
              f"already refreshed: {already_refreshed}"
          )
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"skip={'true' if already_refreshed else 'false'}\n")
          PY
        env:
          SCHEDULE: ${{ github.event.schedule }}

      - name: Set up Python
        if: ${{ !inputs.publish_only && (github.event_name != 'schedule' || steps.retry_guard.outputs.skip != 'true') }}
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch QWeather snapshot
        if: ${{ !inputs.publish_only && (github.event_name != 'schedule' || steps.retry_guard.outputs.skip != 'true') }}
        env:
          QWEATHER_API_HOST: ${{ vars.QWEATHER_API_HOST }}
          QWEATHER_API_KEY: ${{ secrets.QWEATHER_API_KEY }}
          QWEATHER_RUN_MODE: ${{ github.event_name == 'schedule' && (github.event.schedule == '30,45 0 * * *' || github.event.schedule == '15,30,45 1 * * *' || github.event.schedule == '15,30,45 2 * * *') && 'morning' || github.event_name == 'schedule' && 'evening' || '' }}
        run: python qweather_refresh.py

      - name: Persist latest snapshot for the next scheduled run
        if: ${{ !inputs.publish_only && (github.event_name != 'schedule' || steps.retry_guard.outputs.skip != 'true') }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add weather-data.json
          if ! git diff --cached --quiet; then
            git commit -m "Refresh QWeather snapshot"
            git push
          fi

      - name: Configure GitHub Pages
        if: ${{ github.event_name != 'schedule' || steps.retry_guard.outputs.skip != 'true' }}
        uses: actions/configure-pages@v5

      - name: Upload site artifact
        if: ${{ github.event_name != 'schedule' || steps.retry_guard.outputs.skip != 'true' }}
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy to GitHub Pages
        if: ${{ github.event_name != 'schedule' || steps.retry_guard.outputs.skip != 'true' }}
        id: deployment
        uses: actions/deploy-pages@v4
