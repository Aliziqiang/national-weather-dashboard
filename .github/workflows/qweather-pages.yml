name: Refresh QWeather data and publish Pages
on:
  schedule:
    # One daily refresh with off-peak retries. Times are Asia/Shanghai (UTC+8).
    # Retry jobs skip once today's morning snapshot has been saved.
    - cron: "10,25,40,55 20 * * *" # 04:10, 04:25, 04:40, 04:55
    - cron: "10,25,40,55 21 * * *" # 05:10, 05:25, 05:40, 05:55
  workflow_dispatch:
    inputs:
      publish_only:
        description: "仅发布页面，不请求天气数据"
        required: false
        default: false
        type: boolean

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: qweather-pages
  cancel-in-progress: false

jobs:
  refresh-and-publish:
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out site
        uses: actions/checkout@v7

      - name: Ignore old schedules and skip completed retries
        id: retry_guard
        if: ${{ github.event_name == 'schedule' }}
        run: |
          python - <<'PY'
          import json
          import os
          from datetime import datetime, time
          from pathlib import Path
          from zoneinfo import ZoneInfo

          daily_schedules = {
              "10,25,40,55 20 * * *",
              "10,25,40,55 21 * * *",
          }
          schedule = os.environ["SCHEDULE"]
          skip = schedule not in daily_schedules
          if skip:
              print(f"Skipping obsolete scheduled event: {schedule}")
          else:
              data = json.loads(Path("weather-data.json").read_text(encoding="utf-8"))
              tz = ZoneInfo("Asia/Shanghai")
              now = datetime.now(tz)
              slot_start = datetime.combine(now.date(), time(4, 10), tzinfo=tz)
              try:
                  updated_at = datetime.fromisoformat(data.get("updatedAt", ""))
                  if updated_at.tzinfo is None:
                      updated_at = updated_at.replace(tzinfo=tz)
              except (TypeError, ValueError):
                  updated_at = None
              already_refreshed = (
                  data.get("mode") == "morning"
                  and updated_at is not None
                  and updated_at.astimezone(tz) >= slot_start
              )
              skip = already_refreshed
              print(
                  f"Daily morning slot; snapshot updated at: {updated_at}; "
                  f"already refreshed: {already_refreshed}"
              )
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"skip={'true' if skip else 'false'}\n")
          PY
        env:
          SCHEDULE: ${{ github.event.schedule }}

      - name: Set up Python
        if: ${{ !inputs.publish_only && (github.event_name != 'schedule' || steps.retry_guard.outputs.skip != 'true') }}
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Fetch QWeather snapshot
        if: ${{ !inputs.publish_only && (github.event_name != 'schedule' || steps.retry_guard.outputs.skip != 'true') }}
        env:
          QWEATHER_API_HOST: ${{ vars.QWEATHER_API_HOST }}
          QWEATHER_API_KEY: ${{ secrets.QWEATHER_API_KEY }}
          QWEATHER_RUN_MODE: ${{ github.event_name == 'schedule' && (github.event.schedule == '10,25,40,55 20 * * *' || github.event.schedule == '10,25,40,55 21 * * *') && 'morning' || '' }}
        run: python qweather_refresh.py

      - name: Persist latest snapshot for the next scheduled run
        if: ${{ !inputs.publish_only && (github.event_name != 'schedule' || steps.retry_guard.outputs.skip != 'true') }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add weather-data.json
          if ! git diff --cached --quiet; then
            git commit -m "Refresh QWeather snapshot"
            git push
          fi

      - name: Configure GitHub Pages
        if: ${{ github.event_name != 'schedule' || steps.retry_guard.outputs.skip != 'true' }}
        uses: actions/configure-pages@v6

      - name: Upload site artifact
        if: ${{ github.event_name != 'schedule' || steps.retry_guard.outputs.skip != 'true' }}
        uses: actions/upload-pages-artifact@v5
        with:
          path: .

      - name: Deploy to GitHub Pages
        if: ${{ github.event_name != 'schedule' || steps.retry_guard.outputs.skip != 'true' }}
        id: deployment
        uses: actions/deploy-pages@v5
